name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: ubuntu-22.04, name: linux}
          - {os: macos-latest, name: macos}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pyinstaller
      - name: Build + pack
        shell: bash
        run: |
          V=$(python -c "import magichub; print(magichub.__version__)")
          case "${{ matrix.name }}" in
            windows)
              pyinstaller --noconfirm --name MagicHub --windowed --collect-submodules magichub --collect-all pdf2docx entry.py
              (cd dist && 7z a ../MagicHub-windows.zip MagicHub)
              iscc "/DVersion=$V" packaging/windows/MagicHub.iss ;;
            macos)
              bash packaging/macos/build.sh ;;
            linux)
              pyinstaller --noconfirm --name MagicHub --windowed --collect-submodules magichub --collect-all pdf2docx entry.py
              (cd dist && tar czf ../MagicHub-linux.tar.gz MagicHub)
              curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              APPIMAGETOOL="$PWD/appimagetool --appimage-extract-and-run" bash packaging/linux/appimage.sh ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: MagicHub-${{ matrix.name }}
          path: MagicHub-*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "MagicHub-*"}
