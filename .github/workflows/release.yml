name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: ubuntu-22.04, name: linux}
          - {os: macos-latest, name: macos}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pyinstaller
      - name: Build + pack
        shell: bash
        run: |
          V=$(python -c "import magichub; print(magichub.__version__)")
          case "${{ matrix.name }}" in
            windows)
              pyinstaller --noconfirm --name MagicHub --windowed --collect-submodules magichub --collect-all pdf2docx entry.py
              (cd dist && 7z a ../MagicHub-windows.zip MagicHub) ;;
            macos)
              bash packaging/macos/build.sh ;;
            linux)
              pyinstaller --noconfirm --name MagicHub --windowed --collect-submodules magichub --collect-all pdf2docx entry.py
              (cd dist && tar czf ../MagicHub-linux.tar.gz MagicHub)
              curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              APPIMAGETOOL="$PWD/appimagetool --appimage-extract-and-run" bash packaging/linux/appimage.sh ;;
          esac
      - name: Smoke test bản đóng gói
        if: matrix.name != 'macos'
        shell: bash
        run: |
          EXE=dist/MagicHub/MagicHub; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          rm -f smoke.txt
          RUN=""
          if [ "${{ matrix.name }}" = linux ]; then  # pynput cần X server; runner không có
            sudo apt-get install -y --no-install-recommends xvfb >/dev/null
            RUN="xvfb-run -a"
          fi
          MAGICHUB_SMOKE="$PWD/smoke.txt" QT_QPA_PLATFORM=offscreen timeout 300 $RUN "$EXE" || true
          cat smoke.txt  # không có file = app chết trước khi chạy được (cũng coi là lỗi)
          grep -q '^ok' smoke.txt
      - name: Windows installer
        if: matrix.name == 'windows'
        continue-on-error: true  # lỗi installer không chặn zip lên Release
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"  # Git Bash không được đổi "/DVersion=..." thành đường dẫn
        run: |
          V=$(python -c "import magichub; print(magichub.__version__)")
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$ISCC" ] || { choco install innosetup -y --no-progress; ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"; }
          "$ISCC" "/DVersion=$V" packaging/windows/MagicHub.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MagicHub-${{ matrix.name }}
          path: MagicHub-*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "MagicHub-*"}
